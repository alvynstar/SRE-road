groups:
  - name: flask-app
    rules:
      - alert: AppDown
        expr: up{job="sre-lab-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Flask app is unreachable"
          description: "Prometheus cannot scrape the Flask app. The container may be down or the network is broken."
          runbook_url: "https://github.com/toks/sre-lab/blob/main/01-observability/runbooks/HighErrorRate.md"

      - alert: HighErrorRate
        expr: rate(app_errors_total[1m]) > 0.7
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.endpoint }}"
          description: "Error rate is {{ $value | printf \"%.2f\" }} req/s — more than 7 out of 10 requests are failing."
          runbook_url: "https://github.com/toks/sre-lab/blob/main/01-observability/runbooks/HighErrorRate.md"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(app_request_duration_seconds_bucket[1m])) > 5.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.endpoint }}"
          description: "p95 latency is {{ $value | printf \"%.2f\" }}s — users are waiting over 5 seconds."
          runbook_url: "https://github.com/toks/sre-lab/blob/main/01-observability/runbooks/HighLatency.md"

  - name: slo_burn_rate
    rules:
      - alert: SloBudgetFastBurn
        expr: |
          (1 - slo:availability:rate1h) / 0.01 > 14.4
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Error budget burning too fast"
          description: "Burn rate is {{ $value | printf \"%.1f\" }}x — at this rate the monthly error budget will be exhausted in less than 2 days. Immediate action required."

      - alert: SloBudgetSlowBurn
        expr: |
          (1 - slo:availability:rate1h) / 0.01 > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Error budget burning steadily"
          description: "Burn rate is {{ $value | printf \"%.1f\" }}x — budget is being consumed faster than the 30-day window allows. Investigate and fix before budget runs out."
