apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-lab-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-lab-app
  template:
    metadata:
      labels:
        app: sre-lab-app
    spec:
      containers:
      - name: app
        image: ghcr.io/alvynstar/sre-lab-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
